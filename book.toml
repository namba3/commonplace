[book]
title = "Commonplace"
description = "技術、知識、考察を蓄積するCommonplace Book"
language = "ja"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
no-section-label = true
git-repository-url = "https://github.com/namba3/commonplace"
site-url = "/commonplace/"
mathjax-support = true
print.enable = false
additional-css = ["theme/pagefind.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js", "pagefind-init.js"]

[output.html.fold]
enable = true
level = 0

[output.html.search]
enable = false

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
