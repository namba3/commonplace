name: Build and deploy Commonplace

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.22.1
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm

      - name: Install Pagefind 1.5.2
        run: npm ci

      - name: Install mdBook 0.5.4
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.4'

      - name: Install mdbook-mermaid 0.17.1
        run: cargo install mdbook-mermaid --version 0.17.1 --locked

      - name: Prepare Mermaid assets
        run: python3 scripts/prepare-mermaid-assets.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build book
        run: mdbook build

      - name: Prepare Pagefind UI and index content
        run: python3 scripts/prepare-pagefind.py --site book

      - name: Build Pagefind Japanese index
        run: npm exec -- pagefind --site book

      - name: Verify Pagefind output
        run: python3 scripts/verify-pagefind.py --site book

      - name: Smoke test Pagefind searches over HTTP
        run: node scripts/smoke-pagefind.mjs book

      - name: Verify Mermaid and license assets
        run: |
          test "$(mdbook --version)" = "mdbook v0.5.4"
          test "$(mdbook-mermaid --version)" = "mdbook-mermaid 0.17.1"
          test -s mermaid.min.js
          test -s mermaid-init.js
          grep -Eq 'version:"11\.16\.1"' mermaid.min.js
          test -n "$(find book -maxdepth 1 -type f -name 'mermaid-*.min.js' -print -quit)"
          test -n "$(find book -maxdepth 1 -type f -name 'mermaid-init-*.js' -print -quit)"
          grep -lE 'version:"11\.16\.1"' book/mermaid-*.min.js
          grep -q 'class="mermaid"' book/computer-science-theory/mathematics-of-computing/01-math-foundations-ai-overview.html
          if grep -R -q --include='*.html' 'README\.html' book; then
            echo "Generated HTML links to README.html instead of a section index."
            exit 1
          fi
          test -s book/legal/third-party.html
          for license in MIT.txt MIT-Mermaid.txt MIT-Pagefind.txt MIT-js-yaml.txt MIT-Cytoscape.txt MIT-cose-bilkent-4.1.0.txt MIT-fcose-2.2.0.txt MPL-2.0.txt BSD-3-Clause-Highlight.js.txt CC-BY-4.0.txt Apache-2.0.txt Apache-2.0-Open-Sans.txt OFL-1.1-Source-Code-Pro.txt; do
            test -s "book/legal/licenses/$license"
          done
          grep -q 'href="licenses/MIT-Mermaid.txt"' book/legal/third-party.html
          grep -q 'href="licenses/MIT-Pagefind.txt"' book/legal/third-party.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: book

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
